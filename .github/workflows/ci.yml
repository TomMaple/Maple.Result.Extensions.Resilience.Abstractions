# Builds, tests and packs the library on pushes to main and on pull requests. Nothing is published from here:
# releases go through the "Draft release" and "Publish" workflows (see docs/releasing.md).
# The job ids "build" and "newer-sdk" are required status checks: keep the names, and never add a "paths" filter. On pull
# requests that change no code (e.g. only docs/), both are skipped, which counts as passed. The job "reference" checks the
# reference pages against the sources; it always runs, because a change of the documentation alone can break them.
# Jobs:
#   - "changes" (contents and pull-requests read) classifies the changed files (.github/scripts/changes.py);
#   - "reference" (contents read) checks docs/Reference against the sources, and the links of README.md and docs/;
#   - "build" (contents read) checks the formatting and the package dependencies, builds without warnings, tests with
#     at least MINIMUM_COVERAGE line and branch coverage, and uploads the test results and a X.Y.Z-ci.N package;
#   - "newer-sdk" (contents read) builds and tests with the .NET SDK after the one of "build".
# For more information, see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARTIFACTS_PATH: ${{ github.workspace }}/artifacts
  RESULTS_PATH: ${{ github.workspace }}/test-results
  REPORTGENERATOR_VERSION: 5.6.0
  # The minimum line and branch coverage of the library, in percent.
  MINIMUM_COVERAGE: 90
  # The version that the CI packages count towards until the first v* tag exists (afterwards, the tags and the
  # conventional commits give it).
  FIRST_VERSION: 3.0.0
  # The only packages that the library may reference, directly or transitively (#14); the packages that the SDK adds
  # itself (e.g., Microsoft.NET.ILLink.Tasks) are not counted.
  ALLOWED_PACKAGES: Maple.Result

permissions: {}

jobs:
  # Tells whether the pull request changes code or workflows (.github/scripts/changes.py). Pushes and schedules always
  # run everything. A skipped job counts as passed for a required check; the jobs below run when this one fails.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: .github/scripts

    - name: Classify the changed files
      id: filter
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' |
            python3 -I .github/scripts/changes.py | tee -a "$GITHUB_OUTPUT"
        else
          python3 -I .github/scripts/changes.py --all | tee -a "$GITHUB_OUTPUT"
        fi
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}

  # Checks docs/Reference against the sources, and the relative links of README.md and docs/
  # (.github/scripts/check_reference_docs.py; the rules are in docs/conventions.md, "Documentation"). It is not gated
  # on the "changes" job: it reads only the repository, takes seconds, and has to run for a pull request that changes
  # only the documentation, where "build" is skipped.
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The tags: a source link that opens a release is checked against the code of that release.
        fetch-depth: 0
        persist-credentials: false

    - name: Check the reference pages
      run: python3 -I .github/scripts/check_reference_docs.py

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    # git-cliff fails to bump a version when there is no tag yet.
    - name: Check for release tags
      id: tags
      run: |
        if [ -n "$(git tag -l 'v*')" ]; then echo "exist=true" >> "$GITHUB_OUTPUT"; else echo "exist=false" >> "$GITHUB_OUTPUT"; fi

    - name: Get bumped version
      id: git_cliff
      if: steps.tags.outputs.exist == 'true'
      uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
      with:
        version: v2.14.2
        args: --bumped-version

    - name: Calculate version
      id: calculate_version
      run: |
        if [ "$TAGS_EXIST" != "true" ]; then
          NEXT="$FIRST_VERSION"
        else
          NEXT=$(python3 -I .github/scripts/version.py next "$BUMPED")
        fi
        echo "package_version=${NEXT}-ci.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
        echo "informational_version=${NEXT}-ci.${RUN_NUMBER}+${COMMIT}" >> "$GITHUB_OUTPUT"
        echo "Package version: ${NEXT}-ci.${RUN_NUMBER}"
        echo "Informational version: ${NEXT}-ci.${RUN_NUMBER}+${COMMIT}"
      env:
        TAGS_EXIST: ${{ steps.tags.outputs.exist }}
        BUMPED: ${{ steps.git_cliff.outputs.content }}
        RUN_NUMBER: ${{ github.run_number }}
        COMMIT: ${{ github.sha }}

    - name: Setup .NET 10
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Check formatting
      run: dotnet format --verify-no-changes --no-restore

    # Fails when the library references a package (directly or transitively) that is not in ALLOWED_PACKAGES, e.g.
    # Polly or Microsoft.Extensions.*.
    - name: Check the package dependencies
      run: |
        dotnet list src/Maple.Result.Extensions.Resilience.Abstractions package --include-transitive --format json > "${RUNNER_TEMP}/packages.json"
        PACKAGES=$(jq -r '.projects[].frameworks[] | (.topLevelPackages // []) + (.transitivePackages // [])
          | .[] | select(.autoReferenced != "true") | .id' "${RUNNER_TEMP}/packages.json" | sort -u)
        echo "Packages: ${PACKAGES//$'\n'/, }"
        UNEXPECTED=$(comm -23 <(echo "$PACKAGES") <(tr ' ' '\n' <<< "$ALLOWED_PACKAGES" | sort -u))
        if [ -n "$UNEXPECTED" ]; then
          echo "::error::The library references packages that are not allowed: ${UNEXPECTED//$'\n'/, }"
          exit 1
        fi

    # Directory.Build.props turns warnings into errors on GitHub Actions.
    - name: Build
      run: dotnet build --no-restore --configuration Release "-p:Version=${PACKAGE_VERSION}" "-p:InformationalVersion=${INFORMATIONAL_VERSION}"
      env:
        PACKAGE_VERSION: ${{ steps.calculate_version.outputs.package_version }}
        INFORMATIONAL_VERSION: ${{ steps.calculate_version.outputs.informational_version }}

    # Every test project writes a coverage file of its own (no coverage-output option, which would give them one name).
    - name: Test
      run: >-
        dotnet test --no-build --configuration Release --results-directory "$RESULTS_PATH"
        --coverage --coverage-output-format cobertura
        --coverage-settings "${GITHUB_WORKSPACE}/tests/CodeCoverage.config"
        --report-xunit-trx

    - name: Coverage summary
      if: ${{ !cancelled() }}
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool --version "$REPORTGENERATOR_VERSION"
        reportgenerator "-reports:${RESULTS_PATH}/*.cobertura.xml" "-targetdir:${RESULTS_PATH}/coverage-report" -reporttypes:MarkdownSummaryGithub
        cat "${RESULTS_PATH}/coverage-report/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

    # After the summary, so that it is in the job summary also when the coverage is too low. ReportGenerator exits with 1
    # and names the coverage that is below the minimum.
    - name: Coverage threshold
      run: >-
        reportgenerator "-reports:${RESULTS_PATH}/*.cobertura.xml" "-targetdir:${RESULTS_PATH}/coverage-report"
        -reporttypes:TextSummary
        "minimumCoverageThresholds:lineCoverage=${MINIMUM_COVERAGE}"
        "minimumCoverageThresholds:branchCoverage=${MINIMUM_COVERAGE}"

    - name: Upload test results and coverage
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results
        path: ${{ env.RESULTS_PATH }}
        retention-days: 7
        if-no-files-found: warn

    - name: Generate NuGet package
      run: >-
        dotnet pack src/Maple.Result.Extensions.Resilience.Abstractions/Maple.Result.Extensions.Resilience.Abstractions.csproj --no-build --configuration Release
        -o "$ARTIFACTS_PATH" "-p:Version=${PACKAGE_VERSION}" "-p:InformationalVersion=${INFORMATIONAL_VERSION}"
      env:
        PACKAGE_VERSION: ${{ steps.calculate_version.outputs.package_version }}
        INFORMATIONAL_VERSION: ${{ steps.calculate_version.outputs.informational_version }}

    - name: Upload NuGet package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nuget-${{ steps.calculate_version.outputs.package_version }}
        path: |
          ${{ env.ARTIFACTS_PATH }}/*.nupkg
          ${{ env.ARTIFACTS_PATH }}/*.snupkg
        retention-days: 7
        if-no-files-found: error

  # Builds and tests with the .NET SDK after the one of "build": consumers may compile against the package with a newer
  # compiler. The tests still target net10.0, so the .NET 10 runtime is installed too.
  # When the SDK moves on (e.g., to .NET 12), keep the job id (a required check) and update DOTNET_VERSION.
  newer-sdk:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOTNET_VERSION: 11.0.x
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The last version is the SDK that builds (global.json does not pin one); the .NET 10 runtime runs the tests.
    - name: Setup .NET 10 and the newer SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          10.0.x
          ${{ env.DOTNET_VERSION }}

    - name: Check the SDK
      run: |
        SDK=$(dotnet --version)
        echo "SDK: ${SDK}"
        if [ "${SDK%%.*}" != "${DOTNET_VERSION%%.*}" ]; then
          echo "::error::The SDK ${SDK} builds, not ${DOTNET_VERSION}."
          exit 1
        fi

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    # Directory.Build.props turns warnings into errors on GitHub Actions, also those of the newer compiler.
    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --results-directory "$RESULTS_PATH" --report-xunit-trx

    - name: Upload test results
      if: ${{ failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results-newer-sdk
        path: ${{ env.RESULTS_PATH }}
        retention-days: 7
        if-no-files-found: warn
